name: bording_week1
description: "A new Flutter project."

# Prevents accidental publishing to pub.dev since this is a private project
publish_to: 'none' 

# App version and build number
version: 1.0.0+1

# Dart SDK environment
environment:
  sdk: ^3.7.2

# Dependencies needed to run the app
dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8
  
  # State management using Bloc pattern
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7  # Helps in value comparison for Bloc states/events

  # For making HTTP requests
  http: ^1.5.0

  # For unit and widget testing
  flutter_test:
    sdk: flutter

  # For rendering SVG images
  flutter_svg: ^2.2.1

  # For date and time formatting
  intl: ^0.20.2

  # For handling device permissions (camera, storage, etc.)
  permission_handler: ^12.0.1

dev_dependencies:
  # Recommended lint rules for Flutter projects
  flutter_lints: ^5.0.0
  
  # For changing app package name if needed
  change_app_package_name: ^1.5.0

# Flutter-specific configuration
flutter:

  # Ensures Material Design icons are available
  uses-material-design: true

  # Project assets
  assets:
    - assets/          # general assets
    - assets/fonts/    # font files
    - assets/icons/    # icons

  # Custom fonts configuration
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Light.ttf
          weight: 300
        - asset: assets/fonts/Quicksand-Regular.ttf
          weight: 400
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
